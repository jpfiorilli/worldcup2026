name: Traffic Log

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  log-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          VIEWS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/jpfiorilli/worldcup2026/traffic/views")
          TV=$(echo "$VIEWS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',0))" 2>/dev/null || echo 0)
          UV=$(echo "$VIEWS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uniques',0))" 2>/dev/null || echo 0)

          BASE="https://api.counterapi.dev/v1/jpfiorilli-wc2026"
          cnt() { curl -s "$BASE/$1" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count',d.get('value',0)))" 2>/dev/null || echo 0; }

          AV=$(cnt visits);  AS=$(cnt shares)
          T1=$(cnt tab-scores); T2=$(cnt tab-groups); T3=$(cnt tab-fixtures)
          T4=$(cnt tab-stadiums); T5=$(cnt tab-bracket); T6=$(cnt tab-favs); T7=$(cnt tab-about)
          R1=$(cnt region-america); R2=$(cnt region-europe); R3=$(cnt region-africa)
          R4=$(cnt region-asia); R5=$(cnt region-pacific); R6=$(cnt region-australia)

          echo "$DATE|$TV|$UV|$AV|$AS|$T1|$T2|$T3|$T4|$T5|$T6|$T7|$R1|$R2|$R3|$R4|$R5|$R6" > /tmp/metrics.txt
          cat /tmp/metrics.txt

      - name: Update TRAFFIC.md
        run: python3 scripts/update_traffic.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TRAFFIC.md
          git diff --cached --quiet || git commit -m "Traffic $(date -u +%Y-%m-%d)"
          git push
