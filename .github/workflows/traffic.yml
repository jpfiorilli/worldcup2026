name: Traffic Log

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  log-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch counters and update TRAFFIC.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          VIEWS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/jpfiorilli/worldcup2026/traffic/views")
          TV=$(echo "$VIEWS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',0))" 2>/dev/null || echo "0")
          UV=$(echo "$VIEWS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uniques',0))" 2>/dev/null || echo "0")

          cnt() {
            curl -s "https://api.counterapi.dev/v1/jpfiorilli-wc2026/$1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count',d.get('value','0')))" 2>/dev/null || echo "0"
          }

          AV=$(cnt visits)
          AS=$(cnt shares)
          T1=$(cnt tab-scores)
          T2=$(cnt tab-groups)
          T3=$(cnt tab-fixtures)
          T4=$(cnt tab-stadiums)
          T5=$(cnt tab-bracket)
          T6=$(cnt tab-favs)
          T7=$(cnt tab-about)
          R1=$(cnt region-america)
          R2=$(cnt region-europe)
          R3=$(cnt region-africa)
          R4=$(cnt region-asia)
          R5=$(cnt region-pacific)
          R6=$(cnt region-australia)

          ROW1="| $DATE | $TV | $UV | $AV | $AS |"
          ROW2="| $DATE | $T1 | $T2 | $T3 | $T4 | $T5 | $T6 | $T7 |"
          ROW3="| $DATE | $R1 | $R2 | $R3 | $R4 | $R5 | $R6 |"

          if [ ! -f TRAFFIC.md ]; then
            printf '# Traffic Log\n\n## Metricas diarias\n| Fecha | Visitas repo | Unicos | App visits | Shares |\n|---|---|---|---|---|\n\n## Uso de tabs\n| Fecha | Scores | Grupos | Fixture | Estadios | Bracket | Favs | Config |\n|---|---|---|---|---|---|---|---|\n\n## Regiones\n| Fecha | America | Europa | Africa | Asia | Pacifico | Australia |\n|---|---|---|---|---|---|---|\n' > TRAFFIC.md
          fi

          python3 -c "
import sys
lines = open('TRAFFIC.md').readlines()

def append_after_last(lines, marker, row):
    idx = max((i for i,l in enumerate(lines) if marker in l and l.strip().startswith('|')), default=-1)
    if idx == -1:
        return lines + [row+'\n']
    return lines[:idx+1] + [row+'\n'] + lines[idx+1:]

lines = append_after_last(lines, 'Visitas repo', sys.argv[1])
lines = append_after_last(lines, 'Scores | Grupos', sys.argv[2])
lines = append_after_last(lines, 'America', sys.argv[3])
open('TRAFFIC.md','w').writelines(lines)
print('Updated TRAFFIC.md')
" "$ROW1" "$ROW2" "$ROW3"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TRAFFIC.md
          git diff --cached --quiet || git commit -m "Traffic $(date -u +%Y-%m-%d)"
          git push
