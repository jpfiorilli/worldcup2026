/* ── FIFA WORLD CUP 2026 — OFFICIAL DESIGN SYSTEM ─────────── */
/* FIFA palette: deep navy #020F2A, white, We Are 26 multicolor accents  */
/* NIGHT MODE (default — FIFA dark navy) */
:root{
  --bg:#020F2A;
  --bg2:#041428;
  --bg3:#071D38;
  --surface:#0A2040;
  --surface2:#0D2850;
  --border:rgba(255,255,255,.1);
  --border2:rgba(255,255,255,.2);
  /* FIFA We Are 26 accent palette */
  --gold:#C8A84B;        /* WC trophy gold */
  --gold2:#E2C15A;
  --gold3:#F5D98B;
  --accent-coral:#FF6B6B;   /* We Are 26 coral */
  --accent-teal:#00C9A7;    /* We Are 26 teal */
  --accent-purple:#8B5CF6;  /* We Are 26 purple */
  --accent-lime:#84CC16;    /* We Are 26 lime */
  --white:#FFFFFF;
  --off-white:#E8ECF4;
  --gray:#7A8BA8;
  --muted:#2A3F5F;
  --live:#FF3B3B;
  --done:#00C9A7;    /* FIFA teal for finished */
  --elim:#FF6B6B;
  --bubble:#F59E0B;
  --fav:#E2C15A;
  --radius:4px;     /* FIFA uses sharper corners */
  --font-h:'Bebas Neue',sans-serif;
  --font-b:'Noto Sans',sans-serif;
  --topbar-bg:#020F2A;
  --nav-bg:#020F2A;
  --bnav-bg:#020F2A;
  --score-color:#FFFFFF;
}
/* DAY MODE — FIFA light (white + navy accents) */
[data-theme="day"]{
  --bg:#F0F4FC;
  --bg2:#E4EAF6;
  --bg3:#D8E1F0;
  --surface:#FFFFFF;
  --surface2:#F4F7FF;
  --border:rgba(2,15,42,.1);
  --border2:rgba(2,15,42,.2);
  --gold:#9B7B2A;
  --gold2:#B8952F;
  --gold3:#7A6020;
  --accent-coral:#E53535;
  --accent-teal:#00897B;
  --accent-purple:#6D28D9;
  --accent-lime:#65A30D;
  --white:#020F2A;       /* navy text on light bg */
  --off-white:#1A2D4A;
  --gray:#4A6080;
  --muted:#B8C8DC;
  --live:#E53535;
  --done:#00897B;
  --elim:#E53535;
  --bubble:#D97706;
  --fav:#9B7B2A;
  --topbar-bg:#020F2A;   /* FIFA keeps dark topbar even in light mode */
  --nav-bg:#020F2A;
  --bnav-bg:#FFFFFF;
  --score-color:#020F2A;
}
/* ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--white);font-family:var(--font-b);
  min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:72px;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s;
}
/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--topbar-bg);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top, 0px);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px}
/* FIFA rainbow accent bar at bottom of topbar */
.topbar::after{
  content:'';display:block;height:3px;
  background:linear-gradient(90deg,#FF6B6B 0%,#FF6B6B 16.6%,#F59E0B 16.6%,#F59E0B 33.2%,#84CC16 33.2%,#84CC16 49.8%,#00C9A7 49.8%,#00C9A7 66.4%,#8B5CF6 66.4%,#8B5CF6 83%,#C8A84B 83%,#C8A84B 100%);
}
/* BRAND */
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.brand-logo svg{width:36px;height:36px}
.brand-text{display:flex;flex-direction:column;gap:0}
.brand-title{
  font-family:var(--font-h);font-size:22px;letter-spacing:.12em;
  color:#FFFFFF;line-height:1;text-transform:uppercase;
}
.brand-sub{
  font-family:var(--font-b);font-size:8px;font-weight:700;
  color:rgba(255,255,255,.5);letter-spacing:.18em;text-transform:uppercase;line-height:1;margin-top:1px;
}
/* TOP-RIGHT CONTROLS */
.topbar-controls{display:flex;align-items:center;gap:8px}
.live-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,59,59,.15);border:1px solid rgba(255,59,59,.5);
  color:#FF3B3B;font-family:var(--font-h);font-size:12px;letter-spacing:.1em;
  padding:4px 10px;border-radius:2px;text-transform:uppercase;
  transition:all .3s;
}
.live-pill.off{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
.live-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.live-pill.off .live-dot{animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
/* THEME TOGGLE — always white icon since topbar is always dark */
.theme-toggle{
  width:32px;height:32px;border:1px solid rgba(255,255,255,.2);border-radius:2px;
  background:rgba(255,255,255,.06);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:background .2s,border-color .2s;flex-shrink:0;
}
.theme-toggle:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
/* NAV TABS — FIFA style: white text, teal/gold active underline */
.nav-tabs{
  display:flex;border-bottom:1px solid rgba(255,255,255,.12);overflow-x:auto;scrollbar-width:none;
  background:var(--nav-bg);
}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{
  flex-shrink:0;padding:10px 14px;border:none;background:transparent;cursor:pointer;
  font-family:var(--font-h);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.45);border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .2s,border-color .2s;white-space:nowrap;
}
.nav-tab.active{color:#FFFFFF;border-bottom-color:var(--done)}
.nav-tab:hover:not(.active){color:rgba(255,255,255,.75)}
/* PAGES */
.page{display:none}.page.active{display:block}
/* SECTION HEAD — FIFA style: teal left bar */
.sec-head{
  display:flex;align-items:center;gap:8px;padding:14px 14px 7px;
  font-family:var(--font-h);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--off-white);
}
.sec-head::before{content:'';width:3px;height:14px;background:var(--done);flex-shrink:0}
.sec-head::after{content:'';flex:1;height:1px;background:var(--border)}
/* LIVE MATCH — gold-bordered feature card */
.match-live{
  margin:6px 12px;
  background:var(--surface);
  border:1px solid rgba(0,201,167,.4);
  border-radius:var(--radius);overflow:hidden;
  animation:fadein .3s ease;
  position:relative;
}
.match-live::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent-coral),var(--accent-teal),var(--accent-purple));
}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.match-live-hdr{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 12px;background:rgba(0,0,0,.3);
  border-bottom:1px solid var(--border);
}
[data-theme="day"] .match-live-hdr{background:rgba(0,0,0,.06)}
.match-badge{
  font-family:var(--font-h);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;background:rgba(0,201,167,.12);
  color:var(--done);border-radius:2px;padding:2px 8px;
}
.match-min{
  display:flex;align-items:center;gap:5px;
  font-family:var(--font-h);font-size:12px;letter-spacing:.1em;
  color:var(--live);text-transform:uppercase;
}
.match-body{display:flex;align-items:center;padding:12px 14px;gap:8px}
.match-team{flex:1}
.match-team-flag{font-size:24px;display:block;margin-bottom:4px}
.match-team-name{
  font-family:var(--font-h);font-size:17px;letter-spacing:.04em;
  color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.match-team.right{text-align:right}
.score-center{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px}
.score-nums{
  font-family:var(--font-h);font-size:36px;letter-spacing:.04em;line-height:1;
  color:var(--white);
  display:flex;align-items:center;gap:4px;
}
.score-sep{font-size:20px;color:var(--muted)}
.score-venue{font-size:9px;color:var(--gray);letter-spacing:.06em;margin-top:2px;text-transform:uppercase}
/* MATCH CARD */
.match-card{
  margin:4px 12px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);display:flex;align-items:center;padding:9px 12px;gap:8px;
  transition:border-color .2s,background .2s;
}
.match-card:hover{border-color:var(--border2)}
.match-card.fav-match{border-color:rgba(0,201,167,.35);background:rgba(0,201,167,.04)}
.mc-team{
  flex:1;font-family:var(--font-h);font-size:15px;letter-spacing:.04em;
  color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mc-team.right{text-align:right}.mc-team.winner{color:var(--done)}
.mc-center{text-align:center;min-width:86px;flex-shrink:0}
.mc-score{font-family:var(--font-h);font-size:20px;letter-spacing:.04em;color:var(--white)}
.mc-score.up{
  font-family:var(--font-b);font-size:12px;font-weight:700;color:var(--off-white);
  background:var(--surface2);border-radius:2px;padding:3px 9px;display:inline-block;
  border:1px solid var(--border);
}
.mc-score.live-s{color:var(--live)}
.mc-time{font-size:10px;color:var(--gray);margin-top:2px;letter-spacing:.02em}
.mc-flag{font-size:15px;margin-right:5px}.mc-flag-r{font-size:15px;margin-left:5px}
/* COUNTDOWN */
.countdown{
  font-family:var(--font-h);font-size:11px;letter-spacing:.08em;
  color:var(--done);text-transform:uppercase;margin-top:2px;
}
.countdown.soon{color:var(--live);animation:pulse-text 1s ease-in-out infinite}
@keyframes pulse-text{0%,100%{opacity:1}50%{opacity:.4}}
/* LIVE PROGRESS BAR */
.live-progress{height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:6px 14px 2px}
.live-progress-fill{height:100%;background:var(--live);border-radius:2px;transition:width .5s ease}
/* TIME REMAINING */
.live-remain{font-size:10px;color:var(--live);font-family:var(--font-h);letter-spacing:.06em;opacity:.8;margin-top:2px}
.mc-remain{font-size:9px;color:var(--live);opacity:.8}
/* LIVE FIXTURE HIGHLIGHT */

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:8px 14px 0;font-size:10px;color:var(--muted)}

/* FIXTURE VIEW TOGGLE */

}

}

.empty{
  text-align:center;padding:28px 20px;color:var(--muted);
  font-family:var(--font-h);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
}

async function fetchWithTimeout(url,ms=8000,headers={}){

/* ── football-data.org response parser ── */
function processFDOrg(matches){
  const now = new Date();
  /* Clear today's entries first to avoid stale 'live' persisting after a match ends */
  /* Reseed from static results, then API data will override */
  liveData = Object.assign({}, STATIC_RESULTS);
  for(const m of matches){
    const hn = normFD(m.homeTeam?.name||m.homeTeam?.shortName||'');
    const an = normFD(m.awayTeam?.name||m.awayTeam?.shortName||'');
    const st = m.status||'';
    const isHT    = st==='HALFTIME';
    const isLive  = ['IN_PLAY','PAUSED','HALFTIME'].includes(st);
    const isFinal = ['FINISHED','AWARDED'].includes(st);
    const hs = m.score?.fullTime?.home ?? m.score?.halfTime?.home ?? 0;
    const as_ = m.score?.fullTime?.away ?? m.score?.halfTime?.away ?? 0;
    const fix = FIXTURES.find(f=>(f.h===hn&&f.a===an)||(f.h===an&&f.a===hn));
    if(!fix) continue;
    const sw = fix.h===an;
    const kickoff = new Date(fix.utc);
    const minsElapsed = (now - kickoff) / 60000;
    const passedKickoff = now > kickoff;
    /* Only auto-promote to live within reasonable match window (< 130 min from kickoff) */
    const effectiveStatus = isFinal?'ft': isLive?'live': (passedKickoff&&minsElapsed<130)?'live':'sched';
    /* Never downgrade a known ft result — API can be slow to mark FINISHED */
    if(STATIC_RESULTS[fix.id]?.status==='ft' && effectiveStatus!=='ft') continue;
    const min = m.minute ? `${m.minute}'` : '';
    liveData[fix.id] = {hs:sw?as_:hs, as:sw?hs:as_, status:effectiveStatus, min, ht:isHT, src:'football-data.org'};
    if(effectiveStatus==='live' && !isHT){
      const parsedMin = parseInt(m.minute)||0;
      const prev = clockSync[fix.id];
      if(!prev || parsedMin > (prev.min||0)){
        clockSync[fix.id]={min:parsedMin, secs:0, receivedAt:Date.now()};
      }
    }
  }
}

function processESPN(json){
  /* Handle both /scoreboard (events[]) and /header (sports[].leagues[].events[]) formats */
  let events = json.events || json.sports?.[0]?.leagues?.[0]?.events || [];
  liveData = Object.assign({}, STATIC_RESULTS);
  const now=new Date();
  for(const ev of events){
    const c=ev.competitions?.[0];if(!c) continue;
    const comps=c.competitors||[];
    const hc=comps.find(x=>x.homeAway==='home')||comps[0];
    const ac=comps.find(x=>x.homeAway==='away')||comps[1];
    if(!hc||!ac) continue;
    const hn=normESPN(hc.team?.displayName||hc.team?.name||'');
    const an=normESPN(ac.team?.displayName||ac.team?.name||'');
    const st=c.status?.type?.name||'';
    const isHT=st.includes('HALFTIME')||st.includes('HALF_TIME');
    const isLive=st.includes('IN_PROGRESS')||isHT;
    const isFinal=st.includes('FINAL')||st.includes('FULL_TIME');
    const hs=parseInt(hc.score||'0')||0, as_=parseInt(ac.score||'0')||0;
    const fix=FIXTURES.find(f=>(f.h===hn&&f.a===an)||(f.h===an&&f.a===hn));
    if(!fix) continue;
    const sw=fix.h===an;
    const kickoff=new Date(fix.utc);
    const minsElapsed=(now-kickoff)/60000;
    const passedKickoff=now>kickoff;
    /* Only auto-promote to live within reasonable match window (< 130 min from kickoff) */
    const effectiveStatus=isFinal?'ft':isLive?'live':(passedKickoff&&minsElapsed<130)?'live':'sched';
    /* Never downgrade a known ft result — API can be slow to mark FINISHED */
    if(STATIC_RESULTS[fix.id]?.status==='ft' && effectiveStatus!=='ft') continue;
    const min=c.status?.displayClock||'';
    liveData[fix.id]={hs:sw?as_:hs,as:sw?hs:as_,status:effectiveStatus,min,ht:isHT,src:'ESPN'};
    if(effectiveStatus==='live'&&!isHT){
      const rawMin=min.replace("'","").split('+')[0];
      const parsedMin=parseInt(rawMin)||0;
      const prev=clockSync[fix.id];
      if(!prev||parsedMin>(prev.min||0)){
        clockSync[fix.id]={min:parsedMin,secs:0,receivedAt:Date.now()};
      }
    }
  }
  /* Mark fixtures whose kickoff passed but ESPN didn't return (within 130 min window) */
  /* Never override a known 'ft' result — only promote genuinely unknown in-progress games */
  for(const f of FIXTURES){
    const kickoff=new Date(f.utc);
    const minsElapsed=(now-kickoff)/60000;
    const existing=liveData[f.id];
    if(!existing && minsElapsed>0 && minsElapsed<130){
      liveData[f.id]={hs:0,as:0,status:'live',min:'',src:'ESPN'};
    }
  }
}

function buildStandings(){
  standings={};
  for(const[k,d] of Object.entries(GROUPS))
    standings[k]=d.teams.map(t=>({t,w:0,d:0,l:0,gf:0,ga:0,pts:0,p:0}));
  for(const f of FIXTURES){
    const d=liveData[f.id];if(!d||d.status==='sched') continue;
    const hi=standings[f.g].findIndex(r=>r.t===f.h);
    const ai=standings[f.g].findIndex(r=>r.t===f.a);
    if(hi<0||ai<0) continue;
    const H=standings[f.g][hi],A=standings[f.g][ai];
    H.p++;A.p++;H.gf+=d.hs;H.ga+=d.as;A.gf+=d.as;A.ga+=d.hs;
    if(d.hs>d.as){H.w++;H.pts+=3;A.l++;}
    else if(d.hs===d.as){H.d++;H.pts++;A.d++;A.pts++;}
    else{A.w++;A.pts+=3;H.l++;}
  }
  for(const k of Object.keys(standings))
    standings[k].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
  populateBracketFromStandings();
}

/* Fill R32 bracket slots once a group's 6 matches are all finished */
function populateBracketFromStandings(){
  const labelRe=/^(\d+)([A-L]) vs (\d+)([A-L])$/;
  const r32=BRACKET_ROUNDS[0];
  for(const m of r32.matches){
    if(bracketData[m.id]?.status==='ft'||bracketData[m.id]?.status==='live') continue;
    const match=labelRe.exec(m.label);
    if(!match) continue;
    const p1=parseInt(match[1])-1,g1=match[2];
    const p2=parseInt(match[3])-1,g2=match[4];
    const g1fixes=FIXTURES.filter(f=>f.g===g1);
    const g2fixes=FIXTURES.filter(f=>f.g===g2);
    const g1done=g1fixes.length>0&&g1fixes.every(f=>liveData[f.id]?.status==='ft');
    const g2done=g2fixes.length>0&&g2fixes.every(f=>liveData[f.id]?.status==='ft');
    if(!g1done||!g2done) continue;
    const st1=standings[g1],st2=standings[g2];
    if(!st1||!st2) continue;
    const t1=st1[p1]?.t,t2=st2[p2]?.t;
    if(!t1||!t2) continue;
    if(!bracketData[m.id]) bracketData[m.id]={h:t1,a:t2,hs:0,as:0,status:'sched',min:''};
    else{bracketData[m.id].h=t1;bracketData[m.id].a=t2;}
  }
}

/* Qualification status per team */
function getQualStatus(grp,idx,row,gStandings){
  const gfixes=FIXTURES.filter(f=>f.g===grp);
  const played=gfixes.filter(f=>liveData[f.id]?.status==='ft').length;
  const total=gfixes.length; // 6 matches per group
  if(played===0) return 'tbd';
  if(played===total){
    if(idx<2) return 'q';
    return 'elim'; // 3rd/4th determined post-group comparing all 3rds
  }
  // Mid-tournament heuristics (each team plays 3 group games)
  const maxRemaining=(3-row.p)*3;
  const r3=gStandings[2]?.pts||0;
  if(idx<2&&row.pts>r3+maxRemaining) return 'q'; // mathematically through
  if(idx>=2){
    const r2=gStandings[1]?.pts||0;
    if(row.pts+maxRemaining<r2) return 'elim';
    return 'mq';
  }
  return 'mq';
}

/* Countdown string */
function countdown(utcStr){
  const diff=new Date(utcStr)-new Date();
  if(diff<=0) return null;
  const s=Math.floor(diff/1000);
  const m=Math.floor(s/60);
  const h=Math.floor(m/60);
  const d=Math.floor(h/24);
  if(d>0) return `${d}d ${h%24}h`;
  if(h>0) return `${h}h ${m%60}m`;
  if(m>0) return `${m}m ${s%60}s`;
  return `${s}s`;
}
function isSoon(utcStr){
  const diff=new Date(utcStr)-new Date();
  return diff>0&&diff<6*60*1000; // within 6 minutes
}

function renderGroups(){

function teamFixtureQual(group,teamName){
  const rows=standings[group];
  if(!rows) return null;
  const idx=rows.findIndex(r=>r.t===teamName);
  if(idx<0) return null;
  return {pos:idx+1,pts:rows[idx].pts,p:rows[idx].p,qs:getQualStatus(group,idx,rows[idx],rows)};
}

function fixtureCard(f){
  const d=liveData[f.id];
  const fh=isFav(f.h),fa=isFav(f.a),isFavMatch=fh||fa;
  const isLive=d?.status==='live';
  let mid,qualRow='';
  if(d&&d.status==='ft'){
    const hq=teamFixtureQual(f.g,f.h);
    const aq=teamFixtureQual(f.g,f.a);
    if(hq&&aq&&hq.p>0){
      const qLbl=qs=>qs==='q'?' ✓':qs==='elim'?' ✗':qs==='mq'?' ~':'';
      qualRow=`<div class="fix-qual">
        <span class="${hq.qs}">${f.h} ${hq.pos}° · ${hq.pts}pts${qLbl(hq.qs)}</span>&ensp;
        <span class="${aq.qs}">${f.a} ${aq.pos}° · ${aq.pts}pts${qLbl(aq.qs)}</span>
      </div>`;
    }
    mid=`<div class="mc-center"><div style="margin-bottom:2px"><span class="ft-label">FINAL</span></div><div class="mc-score">${d.hs}–${d.as}</div><div class="mc-time">Grupo ${f.g} · ${f.v}</div></div>`;
  } else if(isLive){
    const isHT=d.ht;
    const minTxt=isHT?'Medio Tiempo':d.min||'En vivo';
    const parsedMin=parseInt(d.min)||0;
    const remainLabel=isHT?'':parsedMin>=90?'ET':parsedMin>0?`~${90-parsedMin}m`:'';
    mid=`<div class="mc-center">
      <div class="mc-score live-s">${d.hs}–${d.as}</div>
      <div class="mc-time" style="color:var(--live)"><span data-clock="${f.id}">${minTxt}</span>${remainLabel?` · <span class="mc-remain" data-clock-remain="${f.id}">${remainLabel}</span>`:''}</div>
    </div>`;
  } else {
    const cd=countdown(f.utc);const soon=isSoon(f.utc);
    mid=`<div class="mc-center">
      <div class="mc-score up">${artTime(f.utc)}</div>
      <div class="mc-time">${artDate(f.utc)} · ${f.v}</div>
      ${cd?`<div class="countdown${soon?' soon':''}" data-utc="${f.utc}">⏱ ${cd}</div>`:''}
    </div>`;
  }
  return `<div class="match-card${isFavMatch?' fav-match':''}${isLive?' fixture-live-row':''}" style="margin:4px 8px;padding:7px 10px;flex-wrap:wrap">
    <span class="mc-team" style="font-size:13px"><span class="mc-flag">${fl(f.h)}</span>${fh?'⭐ ':''}${f.h}</span>
    ${mid}
    <span class="mc-team right" style="font-size:13px">${fa?'⭐ ':''}${f.a}<span class="mc-flag-r">${fl(f.a)}</span></span>
    ${qualRow}
  </div>`;
}

function renderFixturesByDate(){
  const byDate={};
  for(const f of [...FIXTURES].sort((a,b)=>new Date(a.utc)-new Date(b.utc))){
    const key=new Intl.DateTimeFormat('sv-SE',{timeZone:TZ}).format(new Date(f.utc));
    if(!byDate[key]) byDate[key]=[];
    byDate[key].push(f);
  }
  let h='';
  for(const date of Object.keys(byDate).sort()){
    const fixes=byDate[date];
    const label=new Intl.DateTimeFormat('es-AR',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'}).format(new Date(fixes[0].utc));

    h+=`<div class="group-block" style="margin-bottom:8px">

function renderBracket(){
  const now=new Date();
  const r32Start=new Date('2026-06-28T00:00:00Z');
  const hasStarted=now>=r32Start;

  let h=`<div class="bracket-wrap">`;

  if(!hasStarted){
    h+=`<div style="text-align:center;padding:30px 20px">
      <div style="font-family:var(--font-h);font-size:28px;font-weight:800;color:var(--gold-light);margin-bottom:8px">BRACKET</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.6">La fase de eliminación directa<br>comienza el <strong style="color:var(--white)">28 de Junio</strong><br>
      <span style="font-family:var(--font-h);font-size:18px;font-weight:700;color:var(--gold);display:block;margin-top:10px" id="bracket-countdown"></span></div>
      <div style="margin-top:20px;font-family:var(--font-h);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase">Vista previa de la estructura del torneo</div>
    </div>`;
  }

  /* Render all rounds */
  for(const round of BRACKET_ROUNDS){
    const isFinalRound=round.id==='final';
    h+=`<div class="bracket-stage-label">${round.label}</div>`;

    if(isFinalRound){
      const m=round.matches[0];
      const bd=bracketData[m.id];
      h+=`<div style="margin:8px 0 16px">`;
      h+=bracketMatch(m,bd,true);
      /* Champion box */
      h+=`<div class="champion-box">
        <div class="champion-label">🏆 Campeón Mundial 2026</div>
        <div class="champion-name" id="champion-name">${getChampion(bd)||'Por definir'}</div>
      </div>`;
      h+=`</div>`;
    } else {
      /* Two-column layout for R32, single column for others */
      const cols=round.id==='r32'?2:round.id==='r16'?2:1;
      const matches=round.matches;
      if(cols===2){
        h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">`;
        matches.forEach(m=>h+=bracketMatch(m,bracketData[m.id],false));
        h+=`</div>`;
      } else {
        matches.forEach(m=>h+=bracketMatch(m,bracketData[m.id],false));
      }
    }
  }

  h+=`</div>`;
  document.getElementById('bracket-content').innerHTML=h;

  /* Update bracket countdown */
  if(!hasStarted){
    const el=document.getElementById('bracket-countdown');
    if(el){
      const cd=countdown(r32Start.toISOString());
      if(cd) el.textContent=`⏱ ${cd}`;
    }
  }
}

function bracketMatch(m,bd,isFinal){
  const hTeam=bd?.h||null;
  const aTeam=bd?.a||null;
  const status=bd?.status||'sched';
  const isLive=status==='live';
  const isFt=status==='ft';
  const hWin=isFt&&bd.hs>bd.as;
  const aWin=isFt&&bd.as>bd.hs;
  const cd=(!hTeam)?countdown(m.utc):null;
  return `<div class="bm${isLive?' live':''}${isFinal?' final-match':''}">
    <div class="bm-date">${artDate(m.utc)} · ${artTime(m.utc)} ART · ${m.v}</div>
    <div class="bm-slot${hWin?' winner':''}">
      <span class="bm-flag">${hTeam?fl(hTeam):'🏳️'}</span>
      <span class="bm-name${!hTeam?' tbd':''}">${hTeam||(m.label||'Por definir')}</span>
      ${isFt||isLive?`<span class="bm-score${isLive?' live-s':''}">${bd.hs}</span>`:''}
    </div>
    <div class="bm-slot${aWin?' winner':''}">
      <span class="bm-flag">${aTeam?fl(aTeam):'🏳️'}</span>
      <span class="bm-name${!aTeam?' tbd':''}">${aTeam||'Por definir'}</span>
      ${isFt||isLive?`<span class="bm-score${isLive?' live-s':''}">${bd.as}</span>`:''}
    </div>
    ${cd&&!hTeam?`<div style="text-align:center;padding:3px;font-family:var(--font-h);font-size:10px;color:var(--gold)">⏱ ${cd}</div>`:''}
  </div>`;
}

function getChampion(bd){
  if(!bd||bd.status!=='ft') return null;
  return bd.hs>bd.as?bd.h:bd.a;
}

/* ═══════════════════════════════════════
   COUNTDOWN TICKER — updates every second
   ═══════════════════════════════════════ */
function tickMatchClocks(){
  for(const [id, sync] of Object.entries(clockSync)){
    const d = liveData[id];
    if(!d || d.status!=='live') continue;
    if(d.ht){ continue; } // halftime — clock frozen, labels already set
    const elapsed = Math.floor((Date.now() - sync.receivedAt) / 1000);
    const totalSecs = sync.min * 60 + elapsed;
    const rawMin = Math.floor(totalSecs/60);
    const dispSec = totalSecs % 60;
    const dispStr = rawMin > 90
      ? `90+${rawMin-90}'${String(dispSec).padStart(2,'0')}`
      : `${rawMin}'${String(dispSec).padStart(2,'0')}`;
    document.querySelectorAll(`[data-clock="${id}"]`).forEach(el=>{ el.textContent=dispStr; });
    const remainStr = rawMin>=90 ? 'Tiempo extra' : `~${90-rawMin}m restantes`;
    document.querySelectorAll(`[data-clock-remain="${id}"]`).forEach(el=>{ el.textContent=remainStr; });
    const pct = Math.min(100, Math.round((rawMin/90)*100));
    document.querySelectorAll(`[data-clock-prog="${id}"]`).forEach(el=>{ el.style.width=pct+'%'; });
  }
}

function tickCountdowns(){
  document.querySelectorAll('[data-utc]').forEach(el=>{
    const cd=countdown(el.dataset.utc);
    const soon=isSoon(el.dataset.utc);
    if(cd){
      el.textContent=`⏱ ${cd}`;
      el.className='countdown'+(soon?' soon':'');
    }
  });
  /* Also update bracket countdown */
  const bcd=document.getElementById('bracket-countdown');
  if(bcd){
    const cd=countdown('2026-06-28T00:00:00Z');
    if(cd) bcd.textContent=`⏱ ${cd}`;
  }
}

function shareApp(){
  const url='https://jpfiorilli.github.io/worldcup2026';
  const txt='Seguí el Mundial con mi app. Incluye resultados en vivo, grupos y el fixture completo. Gratis, sin anuncios.';
  /* Track the share event */
  trackShare().then(()=>{
    /* Optimistically bump displayed counter */
    const se=document.getElementById('stat-shares');
    if(se&&se.textContent!=='…'&&se.textContent!=='—'){
      const n=parseInt(se.textContent.replace(/\D/g,''))||0;
      se.textContent=(n+1).toLocaleString('es-AR');
    }
  });
  /* Native share sheet on mobile */
  if(navigator.share){
    navigator.share({title:'Mundial FIFA 2026',text:txt,url}).catch(()=>{});
    return;
  }
  /* Fallback: copy to clipboard */
  navigator.clipboard?.writeText(url+'\n'+txt).then(()=>{
    const el=document.getElementById('share-copied');
    if(el){el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}
  }).catch(()=>{ prompt('Copiá este link:',url); });
}

function switchPage(name,idx){
  curPage=name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.bb').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.nav-tab')[idx].classList.add('active');
  document.querySelectorAll('.bb')[idx].classList.add('active');
  trackTab(name);  /* 📊 track which tab is used */
  renderAll();
}

function manualRefresh(){
  const b=document.getElementById('rbtn');
  const el=document.getElementById('last-upd');
  b.disabled=true;
  b.classList.add('sp');
  if(el) el.textContent='Actualizando…';

  fetchScores().then(()=>{
    b.classList.remove('sp');
    /* Second fetch after 90s — gives APIs time to mark a just-finished game as FINISHED */
    setTimeout(()=>{
      if(el) el.textContent='Verificando resultados…';
      fetchScores().then(()=>{
        b.disabled=false;
        if(el) el.textContent=`Actualizado: ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${TZ_LABEL}`;
      });
    }, 90000);
  });
}

function setFontSize(cls){
  FS_CLASSES.forEach(c=>document.body.classList.remove(c));
  document.body.classList.add(cls);
  try{localStorage.setItem('wc26_fs',cls)}catch(e){}
  document.querySelectorAll('.fs-btn').forEach(b=>{

  });
}

}catch(e){setFontSize('fs-md');}

function toggleTheme(){
  const isDay=document.documentElement.getAttribute('data-theme')==='day';
  const next=isDay?'night':'day';
  applyTheme(next);
  try{localStorage.setItem('wc26_theme',next)}catch(e){}
}
function applyTheme(t){
  const btn=document.getElementById('theme-toggle');
  if(t==='day'){
    document.documentElement.setAttribute('data-theme','day');
    if(btn) btn.textContent='🌙';
  } else {
    document.documentElement.removeAttribute('data-theme');
    if(btn) btn.textContent='☀️';
  }
}
try{const saved=localStorage.getItem('wc26_theme');if(saved) applyTheme(saved);}catch(e){}

/* Smart polling — 10s when matches are live or during match hours, 30s otherwise */
function smartPoll(){
  const now = new Date();
  const h = now.getUTCHours();
  const hasLive = Object.values(liveData).some(d=>d.status==='live');
  const matchHours = h>=13 || h<=5; // covers all WC kick-offs UTC
  const interval = (hasLive || matchHours) ? 10000 : 30000;
  setTimeout(()=>{ fetchScores().then(smartPoll); }, interval);
}

  document.getElementById('stvc-nm').textContent = v.name;
  document.getElementById('stvc-cy').textContent = v.city;
  document.getElementById('stvc-fl').textContent = v.flag;
  document.getElementById('stvc-cap').textContent = v.cap;
  const mv = document.getElementById('stvc-m');
  mv.textContent = v.matches; mv.style.color = col;
  document.getElementById('stvc-s').textContent = ST_SURF[id]||'🌱';
  document.getElementById('stvc-gl').innerHTML = v.games.map(([t,d])=>
    `<div class="stvc-gmr"><span class="stvc-gmt2">${t}</span><span class="stvc-gmd">${d.toUpperCase()}</span></div>`
  ).join('');
  document.querySelectorAll('.stpin').forEach(p=>p.classList.remove('active'));
  document.getElementById('stpin-'+id)?.classList.add('active');
  document.querySelectorAll('.stvr').forEach(r=>r.classList.remove('on'));
  document.getElementById('stvr-'+id)?.classList.add('on');
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function stBuildList(cf){
  const rows = document.getElementById('stvl-rows'); if(!rows) return;
  rows.innerHTML = ST_ORDER
    .filter(id => !cf || ST_VENUES[id].country === cf)
    .map(id=>{
      const v=ST_VENUES[id], col=ST_COL[v.country];
      return `<div class="stvr" id="stvr-${id}" onclick="stSel('${id}')">
        <div class="stvr-f">${v.flag}</div>
        <div class="stvr-i"><div class="stvr-n">${v.name}</div><div class="stvr-c">${v.city}</div></div>
        <div class="stvr-b" style="color:${col}">${v.matches}<span>partidos</span></div>
      </div>`;
    }).join('');
  document.getElementById('stvr-'+stCur)?.classList.add('on');
}

function stFilt(c,btn){
  document.querySelectorAll('.st-ft').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  stBuildList(c==='all'?null:c);
  document.querySelectorAll('.stpin').forEach(p=>{
    const id=p.id.replace('stpin-','');
    p.style.display=(!c||c==='all'||ST_VENUES[id]?.country===c)?'':'none';
  });
}

</script>
</body>
