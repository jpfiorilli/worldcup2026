name: Traffic Log

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  log-traffic:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect GitHub traffic metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          VIEWS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/jpfiorilli/worldcup2026/traffic/views")
          TV=$(echo "$VIEWS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',0))" 2>/dev/null || echo 0)
          UV=$(echo "$VIEWS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uniques',0))" 2>/dev/null || echo 0)

          CLONES=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/jpfiorilli/worldcup2026/traffic/clones")
          TC=$(echo "$CLONES" | python3 -c "import sys,json; print(json.load(sys.stdin).get('count',0))" 2>/dev/null || echo 0)
          UC=$(echo "$CLONES" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uniques',0))" 2>/dev/null || echo 0)

          echo "$DATE|$TV|$UV|$TC|$UC" > /tmp/metrics.txt
          cat /tmp/metrics.txt

      - name: Update TRAFFIC.md
        run: python3 scripts/update_traffic.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TRAFFIC.md
          git diff --cached --quiet || git commit -m "Traffic $(date -u +%Y-%m-%d)"
          git push
